# alembic.ini
# Configuración de Alembic para el proyecto IA Curricular Engine.

[alembic]
script_location = api/alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se inyecta desde api/alembic/env.py (settings.DATABASE_URL).
# Este valor es un placeholder que env.py sobrescribe.
sqlalchemy.url = sqlite:///./ia_curricular_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S